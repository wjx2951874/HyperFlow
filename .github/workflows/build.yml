name: Build HyperFlow (Miuix)

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.7.1"

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME"/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Install platform android-37.0 (compileSdk=37)
        run: |
          yes | "$ANDROID_HOME"/cmdline-tools/latest/bin/sdkmanager "platforms;android-37.0" "build-tools;36.0.0" > /dev/null || \
          yes | "$ANDROID_HOME"/cmdline-tools/latest/bin/sdkmanager --sdk_root="$ANDROID_HOME" "platforms;android-37.0" "build-tools;36.0.0" > /dev/null || true

      - name: Inject signing secrets (optional)
        env:
          HF_KEYSTORE_B64: ${{ secrets.HF_KEYSTORE_B64 }}
        run: |
          if [ -n "$HF_KEYSTORE_B64" ]; then
            echo "$HF_KEYSTORE_B64" | base64 -d > hyperflow-miuix/keystore.jks
            echo "keystore injected"
          else
            echo "no keystore secret, will use debug signing"
          fi

      - name: Build APK
        working-directory: hyperflow-miuix
        run: gradle assembleRelease --no-daemon
        env:
          HF_KEYSTORE_B64: ${{ secrets.HF_KEYSTORE_B64 }}
          HF_KEY_ALIAS: ${{ secrets.HF_KEY_ALIAS }}
          HF_KEY_PASS: ${{ secrets.HF_KEY_PASS }}

      - name: Assemble flashable zip
        run: |
          set -e
          # 版本号从 ksu-module/module.prop 动态读取（单一事实来源，避免 workflow env 缓存旧值）
          echo "=== MODULE.PROP DEBUG ==="
          cat hyperflow-miuix/ksu-module/module.prop | grep '^version'
          VERSION_NAME=$(grep '^version=' hyperflow-miuix/ksu-module/module.prop | head -1 | cut -d= -f2)
          VERSION_CODE=$(grep '^versionCode=' hyperflow-miuix/ksu-module/module.prop | head -1 | cut -d= -f2)
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
          APK=hyperflow-miuix/app/build/outputs/apk/release/app-release.apk
          test -f "$APK" || { echo "APK not found"; exit 1; }
          rm -rf flash && mkdir -p flash/system/priv-app/HyperFlowPlus
          cp "$APK" flash/system/priv-app/HyperFlowPlus/HyperFlowPlus.apk
          cp "$APK" flash/HyperFlowPlus.apk
          cp hyperflow-miuix/ksu-module/service.sh flash/service.sh
          cp hyperflow-miuix/ksu-module/customize.sh flash/customize.sh
          sed "s/^versionCode=.*/versionCode=${VERSION_CODE}/; s/^version=.*/version=${VERSION_NAME}/; s/^name=.*/name=HyperFlow/" \
            hyperflow-miuix/ksu-module/module.prop > flash/module.prop
          cp hyperflow-miuix/ksu-module/README.txt flash/README.txt
          cd flash && zip -r -X ../HyperFlow-${VERSION_NAME}-flashable.zip . && cd ..
          cp HyperFlow-${VERSION_NAME}-flashable.zip HyperFlow-flashable.zip
          ls -la HyperFlow-flashable.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HyperFlow-flashable
          path: HyperFlow-flashable.zip

      - name: Create GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ env.VERSION_NAME }}
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          gh release create "$TAG" \
            "HyperFlow-${VERSION_NAME}-flashable.zip" \
            --title "HyperFlow V${VERSION_NAME}" \
            --notes "Miuix UI 重构版 · 酷安@翰德姆" || true
